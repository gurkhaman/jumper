[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jumper"
version = "0.1.0"
description = "Herdr-native project picker and workspace launcher"
requires-python = ">=3.10"

[dependency-groups]
dev = ["ruff>=0.12,<1"]

[project.scripts]
jumper = "jumper.cli:main"

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "UP", "B", "SIM", "I", "RUF"]

[tool.setuptools.packages.find]
include = ["jumper*"]
